<!doctype html>
<!-- form comes from: 使用者指定的 A 構圖——一個共同冠部下連精確五根成熟香蕉；冠部的雙主叉僅隱約呼應一→二。 -->

</head>

    <linearGradient id="glassSheen" x1="195" y1="105" x2="815" y2="890" gradientUnits="userSpaceOnUse">

      <path d="M511 353C488 429 488 602 523 717" fill="none" stroke="#FFF4D6" stroke-opacity=".68" stroke-width="17" stroke-linecap="round" filter="url(#smallBlur)"/>
      <path d="M495 778C520 805 554 793 567 753" fill="none" stroke="#8A5A2B" stroke-opacity=".72" stroke-width="11" stroke-linecap="round"/>

      <path d="M486 238C503 222 522 220 536 230" fill="none" stroke="#FFF4D6" stroke-opacity=".45" stroke-width="7" stroke-linecap="round"/>

    <g fill="#8A5A2B" fill-opacity=".75">
