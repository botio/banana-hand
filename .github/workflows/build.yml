# Cross-platform packaging for Banana Hand.
#
# Each job builds NATIVELY on its own OS runner (no cross-compilation), so the
# `beforeBuildCommand` sidecar build (`npm run bundle-native-host`, which uses the
# host triple) always lands the native-host binary in the same target dir Tauri
# consumes for `--target <triple>`. Outputs:
#   - ubuntu-24.04  -> .deb + .AppImage
#   - windows-latest -> NSIS installer (.exe)
#   - macos-latest  -> unsigned, un-notarized DMG
#
# macOS has no Apple signing/notarization here, so the DMG is unsigned by design.
name: Build & Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: "deb,appimage"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: "nsis"
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: "dmg"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tauri v2 on Linux links against webkit2gtk-4.1; ubuntu-24.04 ships it.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libglib2.0-dev \
            libssl-dev \
            pkg-config

      - name: Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Runs `beforeBuildCommand` (native-host sidecar + frontend build), then
      # bundles only the targets valid for this OS.
      - name: Build app + native-host sidecar
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: banana-hand-${{ matrix.os }}
          path: target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error

  release:
    name: Publish preview release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Package browser extensions
        run: |
          node scripts/package-chromium-extension.mjs
          node scripts/package-firefox-extension.mjs

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Stage browser extension assets
        run: |
          mkdir -p release-assets/browser-extensions
          cp dist/chromium-extension/*.zip release-assets/browser-extensions/
          cp dist/firefox-extension/*.xpi release-assets/browser-extensions/

      - name: Publish GitHub preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          test "${#assets[@]}" -gt 0
          notes=$'Preview release only: build artifacts are attached, but this release does not claim a supported platform/browser pair. See docs/adr/0003-release-evidence-matrix.md for the required 24-cell real-device evidence matrix.\n\nFirefox XPI is unsigned: it installs only in Firefox Developer Edition, Nightly, or ESR with signature enforcement disabled until AMO signing is available.'
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --prerelease \
              --latest=false \
              --title "Banana Hand ${GITHUB_REF_NAME} (Preview)" \
              --notes "${notes}" \
              --generate-notes
          fi
