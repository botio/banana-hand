# Cross-platform packaging for Banana Hand.
#
# Each job builds NATIVELY on its own OS runner (no cross-compilation), so the
# `beforeBuildCommand` sidecar build (`npm run bundle-native-host`, which uses the
# host triple) always lands the native-host binary in the same target dir Tauri
# consumes for `--target <triple>`. Outputs:
#   - ubuntu-24.04  -> .deb + .AppImage
#   - windows-latest -> NSIS installer (.exe)
#   - macos-latest  -> ad-hoc-signed, un-notarized DMG
#
# Without an Apple Developer ID the DMG is ad-hoc signed; the user clears
# Gatekeeper quarantine with one xattr command (see README + release notes).
name: Build & Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: "deb,appimage"
            macos_signing_identity: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: "nsis"
            macos_signing_identity: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: "dmg"
            # No Apple Developer ID in CI: "-" makes Tauri sign ad-hoc
            # (codesign --sign -). macOS shows "damaged" until the user clears
            # quarantine with one xattr command (README + release notes).
            macos_signing_identity: "-"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tauri v2 on Linux links against webkit2gtk-4.1; ubuntu-24.04 ships it.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libglib2.0-dev \
            libssl-dev \
            pkg-config

      - name: Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify native host and extension reconnect regressions
        run: |
          cargo test -p banana-hand-native-host
          npm run test:extensions

      - name: Verify shortcut input survives background refresh
        if: matrix.os == 'ubuntu-24.04'
        run: |
          npx playwright install --with-deps chromium
          npm run test:ui

      # Runs `beforeBuildCommand` (native-host sidecar + frontend build), then
      # bundles the targets valid for this OS. On macOS there is no Apple
      # Developer ID, so the DMG is ad-hoc signed; the user clears Gatekeeper
      # quarantine with one xattr command (see README + release notes).
      - name: Build app + native-host sidecar
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.macos_signing_identity }}
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Verify macOS foreground conversion and Accessibility query
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo test -p banana-hand --target ${{ matrix.target }} 'input::'

      - name: Verify macOS app signature inside the DMG
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          dmg=$(find target/${{ matrix.target }}/release/bundle/dmg -name '*.dmg' -print -quit)
          test -n "${dmg}"
          mount_point=$(mktemp -d /tmp/banana-hand-dmg.XXXXXX)
          hdiutil attach "${dmg}" -nobrowse -noverify -mountpoint "${mount_point}"
          app=$(find "${mount_point}" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "${app}"
          codesign --verify --deep --strict "${app}"
          codesign --display --verbose=4 "${app}"
          hdiutil detach "${mount_point}"

      - name: Verify Windows native host registration
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo test -p banana-hand --target ${{ matrix.target }} native_host

      - name: Verify Windows release host bidirectional preparation
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo test --locked -p banana-hand --release --target ${{ matrix.target }} windows_tests -- --nocapture --test-threads=1

      - name: Smoke-test installed Windows startup and browser discovery
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "No NSIS installer found." }
          $install = Join-Path $env:RUNNER_TEMP "banana hand install"
          $diag = Join-Path $env:RUNNER_TEMP "banana-hand-windows-smoke"
          pwsh -File scripts/verify-windows-startup.ps1 `
            -InstallerPath $installer.FullName `
            -InstallDirectory $install `
            -DiagnosticsDirectory $diag `
            -StartupTimeoutSeconds 90

      - name: Upload Windows smoke diagnostics
        if: always() && matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/upload-artifact@v4
        with:
          name: banana-hand-windows-smoke-diagnostics
          path: ${{ runner.temp }}/banana-hand-windows-smoke/**
          if-no-files-found: warn

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: banana-hand-${{ matrix.os }}
          path: target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error

  release:
    name: Publish preview release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install release tooling
        run: npm ci

      - name: Package Chrome extension
        run: node scripts/package-chromium-extension.mjs
      - name: Package Firefox temporary extension
        run: node scripts/package-firefox-temporary-extension.mjs


      - name: Validate Firefox manifest and extension
        run: npx web-ext lint --source-dir=extensions/firefox --warnings-as-errors

      - name: Sign Firefox extension through AMO
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          : "${WEB_EXT_API_KEY:?AMO_JWT_ISSUER is required for a signed Firefox release}"
          : "${WEB_EXT_API_SECRET:?AMO_JWT_SECRET is required for a signed Firefox release}"
          npm run sign-firefox-extension

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Stage browser extension assets
        run: |
          mkdir -p release-assets/browser-extensions
          cp dist/chromium-extension/*.zip release-assets/browser-extensions/
          cp dist/firefox-temporary-extension/*.zip release-assets/browser-extensions/
          xpis=(dist/firefox-extension/*.xpi)
          test "${#xpis[@]}" -eq 1
          cp "${xpis[0]}" "release-assets/browser-extensions/banana-hand-firefox-${GITHUB_REF_NAME#v}-signed.xpi"

      - name: Publish GitHub preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f \( \
            -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.exe' \
            -o -name '*.zip' -o -name '*.xpi' \
          \) -print0)
          test "${#assets[@]}" -gt 0
          notes=$'Preview release only: build artifacts are attached, but this release does not claim a supported platform/browser pair. See docs/adr/0003-release-evidence-matrix.md for the required 24-cell real-device evidence matrix.\n\nFirefox: this release includes an AMO-signed unlisted XPI. Install it permanently through about:addons > gear menu > Install Add-on From File. The extension uses Manifest V3 with a Firefox event page, not a service worker. Its fixed ID remains bridge@banana-hand.dev. Download and install the signed XPI again for updates; no automatic update source is configured. The temporary ZIP remains available for development via about:debugging.\n\nChromium: unzip banana-hand-chromium and use Load unpacked in chrome://extensions. The fixed extension ID is mooakjhlbkjfbmbmliklkmfmacnomlai.\n\nWindows: the NSIS installer bundles the native host and offline WebView2 Runtime installer. No Authenticode certificate is configured, so SmartScreen may show an unknown publisher warning. This does not establish that earlier launch failures were caused by WebView2.\n\nmacOS (Apple Silicon): the DMG is ad-hoc signed, without Apple Developer ID or notarization. If Gatekeeper blocks launch, after verifying the download source, copy the app to /Applications and clear quarantine with: xattr -dr com.apple.quarantine "/Applications/Banana Hand.app".\n\nLinux: the AppImage bundles the native host; the .deb installs it at /usr/bin/banana-hand-native-host.\n'
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft=false \
              --prerelease \
              --latest=false \
              --title "Banana Hand ${GITHUB_REF_NAME} (Preview)" \
              --notes "${notes}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --prerelease \
              --latest=false \
              --title "Banana Hand ${GITHUB_REF_NAME} (Preview)" \
              --notes "${notes}" \
              --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
