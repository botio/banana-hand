[workspace]
resolver = "3"
members = ["crates/protocol", "crates/native-host", "src-tauri"]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "MIT"
authors = ["Banana Hand"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
